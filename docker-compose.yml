services:
  watchroom:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watchroom
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - MEDIA_EGRESS_PROTECTED=true
      - ALLOW_UNSAFE_MEDIA_FETCHES=true
      - MEDIA_DIR=/app/media
      - DB_PATH=/app/data/watchroom.db
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3000/healthz\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
