services:
  watchroom:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    # Required by the entrypoint firewall; dropped before Node/FFmpeg run.
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: 3000
      MEDIA_DIR: /app/media
      DB_PATH: /app/data/watchroom.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - ./data:/app/data
      - ./media:/app/media
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      watchroom:
        condition: service_healthy

  caddy-http:
    image: caddy:2-alpine
    profiles: [http]
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/Caddyfile.http:/etc/caddy/Caddyfile:ro
    depends_on:
      watchroom:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
